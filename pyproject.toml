[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seao-forage-watch"
version = "0.1.0"
description = "Veille reproductible des appels d'offres de forage publiés sur le SEAO"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
seao-watch = "seao_watch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seao_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

