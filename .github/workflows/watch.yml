name: Veille SEAO

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seao-daily-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: seao-watch run
      - name: Conserver l'état et le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/seao.duckdb data/reports/latest.md data/raw/manifest.jsonl data/raw/*.json
          git diff --cached --quiet || git commit -m "chore: actualiser la veille SEAO"
          git push
